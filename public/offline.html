<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>オフラインです</title>
    <style>
      :root {
        --bg: #f1f4fb;
        --panel: #ffffff;
        --ink: #121a2e;
        --mute: #5b657a;
        --line: #dde2ee;
        --accent: #3b5bff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1220;
          --panel: #161d30;
          --ink: #e8ecf7;
          --mute: #93a0ba;
          --line: #27314a;
          --accent: #5570ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(24rem, 100%);
        padding: 1.5rem;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 0.75rem;
      }
      h1 {
        margin: 0;
        font-size: 1.125rem;
      }
      p {
        margin: 0.75rem 0 0;
        font-size: 0.875rem;
        line-height: 1.7;
        color: var(--mute);
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        min-height: 2.75rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>インターネットにつながっていません</h1>
      <p>通信できる場所で、もう一度ためしてください。つながると自動で読み込み直します。</p>
      <button type="button" onclick="location.reload()">もう一度読み込む</button>
    </main>
    <script>
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
